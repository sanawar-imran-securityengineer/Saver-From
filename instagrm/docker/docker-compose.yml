version: '3.8'

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: always
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CACHE_TTL=3600
      - ENVIRONMENT=production
      - WORKERS=4
    depends_on:
      - redis
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

volumes:
  redis_data:
