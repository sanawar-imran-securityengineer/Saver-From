<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <!-- Premium Gradient Background -->
    <linearGradient id="sfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="55%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Subtle Inner Border Gradient -->
    <linearGradient id="sfBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2" />
    </linearGradient>

    <!-- Downward Arrow Fill -->
    <linearGradient id="sfArrow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0f9ff" />
    </linearGradient>

    <!-- Play Accent Gradient -->
    <linearGradient id="sfAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="sfShadow" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#1e3a8a" flood-opacity="0.28" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="10" y="10" width="100" height="100" rx="28" fill="url(#sfBg)" filter="url(#sfShadow)" />
  <rect x="10.5" y="10.5" width="99" height="99" rx="27.5" stroke="url(#sfBorder)" stroke-width="1.2" />

  <!-- Play Symbol Accent (Subtle geometric background pulse) -->
  <path d="M44 32 L78 52 Q82 54.5 78 57 L44 77 Q40 79.5 40 75 L40 34 Q40 29.5 44 32 Z" 
        fill="#ffffff" fill-opacity="0.14" />

  <!-- High-Precision Center Download Arrow -->
  <!-- Arrow Shaft & Flanges -->
  <path d="M54 28 C54 26 55.8 24.5 57.8 24.5 L62.2 24.5 C64.2 24.5 66 26 66 28 L66 48 L76 48 C78.3 48 79.4 50.8 77.7 52.4 L62.1 67.5 C60.9 68.6 59.1 68.6 57.9 67.5 L42.3 52.4 C40.6 50.8 41.7 48 44 48 L54 48 Z" 
        fill="url(#sfArrow)" />

  <!-- Media Dock / Baseline Tray -->
  <rect x="36" y="74" width="48" height="6.5" rx="3.25" fill="#ffffff" fill-opacity="0.95" />

  <!-- Precision High-Speed Speed Spark -->
  <circle cx="84" cy="34" r="4.5" fill="url(#sfAccent)" />
  <circle cx="84" cy="34" r="2" fill="#ffffff" />
</svg>
