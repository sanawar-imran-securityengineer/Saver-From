<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Main Background Gradient -->
    <linearGradient id="sfBg" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="45%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Glowing Rim Gradient -->
    <linearGradient id="sfRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2" />
    </linearGradient>

    <!-- Arrow Inner Gradient -->
    <linearGradient id="sfArrowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="sfDrop" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1e40af" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base with Soft Shadow -->
  <rect x="12" y="12" width="96" height="96" rx="26" fill="url(#sfBg)" filter="url(#sfDrop)" />
  
  <!-- Subtle Highlight Border -->
  <rect x="12.5" y="12.5" width="95" height="95" rx="25.5" stroke="url(#sfRim)" stroke-width="1.5" fill="none" />

  <!-- Dynamic Play Triangle Accent (Faint Geometric Background Element) -->
  <path d="M42 34 L78 58 Q82 60 78 62 L42 86 Q38 88 38 84 L38 36 Q38 32 42 34 Z" 
        fill="white" fill-opacity="0.12" />

  <!-- Modern Sleek Download Arrow with Stream Cut -->
  <!-- Upper Stem -->
  <path d="M54 32 C54 29.8 55.8 28 58 28 L62 28 C64.2 28 66 29.8 66 32 L66 54 L76.8 54 C79.2 54 80.4 56.9 78.7 58.6 L61.9 75.4 C60.8 76.5 59.2 76.5 58.1 75.4 L41.3 58.6 C39.6 56.9 40.8 54 43.2 54 L54 54 Z" 
        fill="url(#sfArrowGrad)" />

  <!-- Modern Clean Bottom Tray / Media Cradle -->
  <path d="M38 78 C38 76.3 39.3 75 41 75 L79 75 C80.7 75 82 76.3 82 78 C82 79.7 80.7 81 79 81 L41 81 C39.3 81 38 79.7 38 78 Z" 
        fill="#ffffff" fill-opacity="0.95" />

  <!-- High-Speed Lightning Pulse Spark -->
  <circle cx="85" cy="35" r="4.5" fill="#38bdf8" />
  <circle cx="85" cy="35" r="2" fill="#ffffff" />
</svg>
