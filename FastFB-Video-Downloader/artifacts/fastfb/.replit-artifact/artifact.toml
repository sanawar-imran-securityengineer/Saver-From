kind = "web"
previewPath = "/"
title = "FastFB Video Downloader"
description = "A responsive Facebook video downloader with a polished multilingual interface, quality selection, dark mode, and a Flask-compatible extraction API for real downloads."
version = "1.0.0"
id = "artifacts/fastfb"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21250

[services.development]
run = "pnpm --filter @workspace/fastfb run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/fastfb", "run", "build" ]
serve = "static"
publicDir = "artifacts/fastfb/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21250"
BASE_PATH = "/"
