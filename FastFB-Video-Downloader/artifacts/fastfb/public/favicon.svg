<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- VIP Royal Blue Gradient -->
    <linearGradient id="vipGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E6BFF"/>
      <stop offset="45%" stop-color="#0866FF"/>
      <stop offset="100%" stop-color="#003EB3"/>
    </linearGradient>
    <!-- Cyan Neon Accent -->
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="100%" stop-color="#00A3FF"/>
    </linearGradient>
    <!-- Top Gloss Effect -->
    <linearGradient id="glossEffect" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
    <!-- Glow Shadow Filter -->
    <filter id="vipGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Rounded Squircle -->
  <rect x="4" y="4" width="172" height="172" rx="44" fill="url(#vipGradient)"/>
  
  <!-- Subtle Glowing Border -->
  <rect x="5.5" y="5.5" width="169" height="169" rx="42.5" stroke="rgba(255,255,255,0.3)" stroke-width="3"/>

  <!-- Top Glass Highlight -->
  <path d="M 6 52 C 6 26.6 26.6 6 52 6 L 128 6 C 153.4 6 174 26.6 174 52 C 174 80 6 80 6 52 Z" fill="url(#glossEffect)"/>

  <!-- VIP Inner Tech Circle -->
  <circle cx="90" cy="90" r="62" stroke="url(#cyanNeon)" stroke-width="3" stroke-dasharray="14 8" opacity="0.65"/>

  <!-- Dynamic VIP Downloader Symbol -->
  <!-- Downward Arrow Shaft -->
  <path d="M 90 52 L 90 106" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
  <!-- Downward Arrow Head -->
  <path d="M 64 88 L 90 114 L 116 88" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Glowing Base Tray / Play Arc -->
  <path d="M 56 130 C 72 142 108 142 124 130" stroke="url(#cyanNeon)" stroke-width="9" stroke-linecap="round" filter="url(#vipGlow)"/>

  <!-- Top Right VIP Sparkle Star -->
  <path d="M 136 34 L 138 42 L 146 44 L 138 46 L 136 54 L 134 46 L 126 44 L 134 42 Z" fill="#00F5FF"/>
</svg>
